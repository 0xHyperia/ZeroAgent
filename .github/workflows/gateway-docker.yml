name: Gateway Docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的现有标签，例如 v0.1.0
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/zeroagent-gateway

jobs:
  quality-gate:
    name: Gateway Release Gate
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with: {go-version-file: crates/agent-gateway/go.mod}
      - uses: actions/setup-node@v6
        with: {node-version: 22.19.0}
      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/release/prepare-app-version-from-tag.mjs "$RELEASE_TAG" --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT" --json
      - run: npm install -g pnpm@10.32.1
      - run: pnpm install --frozen-lockfile && pnpm test && pnpm build && pnpm lint
        working-directory: crates/agent-gateway/web
      - run: go test ./...
        working-directory: crates/agent-gateway
      - run: make deploy-validate

  build-and-push:
    name: Build and Push Gateway Image
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.quality-gate.outputs.release_tag }}
            type=raw,value=latest,enable=${{ needs.quality-gate.outputs.is_prerelease == 'false' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            ZEROAGENT_APP_VERSION=${{ needs.quality-gate.outputs.app_version }}

      # Guard against mislabeled variants: v0.1.0 through v1.1.8 advertised
      # arm64 while shipping an x86-64 binary (TARGETARCH defaults in the
      # Dockerfile shadowed the values buildx injects).
      - name: Verify per-arch binaries
        run: |
          set -euo pipefail
          repo="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          index="$repo@${{ steps.push.outputs.digest }}"
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) want="x86-64" ;;
              arm64) want="aarch64" ;;
            esac
            # Pull each variant by its own manifest digest. Pulling the shared
            # index digest with --platform binds repo@digest to one platform,
            # so the second arch fails with "cannot overwrite digest".
            digest="$(docker buildx imagetools inspect --raw "$index" \
              | jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')"
            test -n "$digest" || { echo "::error::pushed index has no linux/$arch manifest"; exit 1; }
            docker pull "$repo@$digest" >/dev/null
            docker rm -f "verify-$arch" >/dev/null 2>&1 || true
            docker create --name "verify-$arch" "$repo@$digest" >/dev/null
            docker cp "verify-$arch:/usr/local/bin/liveagent-gateway" "/tmp/gateway-$arch"
            docker rm -f "verify-$arch" >/dev/null
            info="$(file -b "/tmp/gateway-$arch")"
            echo "linux/$arch: $info"
            echo "$info" | grep -q "$want" || { echo "::error::linux/$arch image contains a non-$arch gateway binary"; exit 1; }
          done
