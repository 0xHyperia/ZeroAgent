name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: 22.19.0

jobs:
  product-contract:
    name: ZeroAgent Product Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: node scripts/check-zeroagent-product-contract.mjs

  deployment:
    name: Deployment Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make deploy-validate

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # buf breaking uses the actual PR base, including v2 integration PRs.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/agent-gateway/go.mod
          cache-dependency-path: crates/agent-gateway/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.71.0

      - name: Install protobuf Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build embedded Gateway WebUI
        run: |
          pnpm install --frozen-lockfile --filter @liveagent/gateway-webui...
          pnpm --filter @liveagent/gateway-webui build

      - name: Proto lint and breaking-change check
        env:
          PROTO_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make proto-check BUF_BREAKING_AGAINST="../../.git#ref=${PROTO_BASE_SHA},subdir=crates/agent-gateway"

      - name: Check generated protobuf
        run: |
          make proto
          git diff --exit-code -- crates/agent-gateway/internal/proto crates/agent-gateway/web/src/lib/proto/gen

      - name: Lint gateway
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: crates/agent-gateway

      - name: Test gateway
        working-directory: crates/agent-gateway
        run: go test ./...

      - name: Test Gateway data races
        working-directory: crates/agent-gateway
        run: go test -race ./...

  gateway-docker:
    name: Gateway Docker Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: liveagent-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image health and dependency readiness
        env:
          GATEWAY_DOCKER_IMAGE: liveagent-gateway:ci
        run: bash scripts/check-gateway-docker-smoke.sh

  webui:
    name: Gateway WebUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter zeroagent... --filter @liveagent/gateway-webui...

      - name: Build WebUI
        working-directory: crates/agent-gateway/web
        run: pnpm build

      - name: Lint WebUI
        working-directory: crates/agent-gateway/web
        run: pnpm lint

      - name: Test WebUI modules
        working-directory: crates/agent-gateway/web
        run: pnpm test

  gui:
    name: GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - name: Install dependencies
        # GUI frontend tests load shared Gateway WebUI modules (including STT adapters).
        # Install that workspace and its transitive dependencies in this isolated job.
        run: pnpm install --frozen-lockfile --filter zeroagent... --filter @liveagent/gateway-webui...

      - name: Typecheck and build GUI frontend
        working-directory: crates/agent-gui
        run: pnpm build

      - name: Lint GUI frontend
        working-directory: crates/agent-gui
        run: pnpm lint

      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/agent-gateway/go.mod
          cache-dependency-path: crates/agent-gateway/go.sum

      - name: Prepare reviewed K-brain fixture
        run: |
          pnpm build:kbrain:source --target x86_64-unknown-linux-gnu
          pnpm prepare:kbrain:release --target x86_64-unknown-linux-gnu
          echo "ZEROAGENT_BACKEND_BINARY=$GITHUB_WORKSPACE/crates/agent-gui/src-tauri/binaries/k-brain-x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"

      - name: Test frontend modules
        working-directory: crates/agent-gui
        run: pnpm test:frontend

      - name: Test release scripts
        working-directory: crates/agent-gui
        run: pnpm test:release

  tauri-rust:
    name: Tauri Rust Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: crates/agent-gateway/go.mod
          cache-dependency-path: crates/agent-gateway/go.sum

      - name: Prepare reviewed desktop sidecars
        run: |
          npm install -g pnpm@10.32.1
          pnpm install --frozen-lockfile
          pnpm build:kbrain:source --target x86_64-unknown-linux-gnu
          pnpm prepare:kbrain:release --target x86_64-unknown-linux-gnu
          node scripts/prepare-gateway.mjs --target x86_64-unknown-linux-gnu
          node scripts/release/verify-kbrain-packaging.mjs --target x86_64-unknown-linux-gnu --binary-dir crates/agent-gui/src-tauri/binaries --patch-manifest patches/kbrain/manifest.json

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install repository-pinned Protoc
        uses: jdx/mise-action@v4
        with:
          install_args: protoc
          env: false
          export_path: false

      - name: Select repository-pinned Protoc for Native
        run: |
          protoc_binary="$(mise which protoc)"
          "$protoc_binary" --version
          sha256sum "$protoc_binary"
          printf 'PROTOC=%s\n' "$protoc_binary" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Check Tauri backend tests
        env:
          CARGO_TERM_COLOR: always
        run: cargo check --locked --manifest-path crates/agent-gui/src-tauri/Cargo.toml --tests

      - name: Test Tauri library
        env:
          CARGO_TERM_COLOR: always
          ZEROAGENT_DEV_HOME: ${{ runner.temp }}/zeroagent-native-home
        run: cargo test --locked --manifest-path crates/agent-gui/src-tauri/Cargo.toml --lib

      - name: Verify native export and locked-backend migration rollback fixture
        env:
          CARGO_TERM_COLOR: always
          ZEROAGENT_DEV_HOME: ${{ runner.temp }}/zeroagent-native-home
          ZEROAGENT_HISTORY_IMPORT_ACCEPTANCE_DIR: ${{ github.workspace }}/.codex-artifacts/ci-migration
        run: |
          mkdir -p "$ZEROAGENT_HISTORY_IMPORT_ACCEPTANCE_DIR"
          cargo test --locked --manifest-path crates/agent-gui/src-tauri/Cargo.toml --lib exports_checkpoint_acceptance_fixture
          node scripts/check-zeroagent-migration.mjs "$ZEROAGENT_HISTORY_IMPORT_ACCEPTANCE_DIR"

      - name: Verify fresh profile and current backup format
        env:
          CARGO_TERM_COLOR: always
          ZEROAGENT_DEV_HOME: ${{ runner.temp }}/zeroagent-native-home
          ZEROAGENT_BACKEND_BINARY: ${{ github.workspace }}/crates/agent-gui/src-tauri/binaries/k-brain-x86_64-unknown-linux-gnu
        run: |
          cargo test --locked --manifest-path crates/agent-gui/src-tauri/Cargo.toml --lib fresh_schema_does_not_create_or_read_old_provider_archives
          cargo test --locked --manifest-path crates/agent-gui/src-tauri/Cargo.toml --lib parse_backup_document_rejects_older_versions_without_importing_domains
          cargo test --locked --manifest-path crates/agent-gui/src-tauri/Cargo.toml --lib canonical_backup_roundtrip_keeps_account_models_and_survives_restart
          node --test crates/agent-gui/test/settings/native-config-batch.test.mjs crates/agent-gui/test/settings/storage.test.mjs crates/agent-gui/test/settings/backup-restore.test.mjs

  ui-boundaries:
    name: Shared UI Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - name: Install dependencies
        # Shared UI typechecking resolves its app/adapters and Vite types from GUI.
        run: pnpm install --frozen-lockfile --filter zeroagent...

      - name: Check shared UI dependency boundaries and mirrors
        run: node scripts/check-mirror.mjs

      - name: Reject new Biome warnings
        env:
          ZEROAGENT_CHECK_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/check-biome-changed.mjs ui
          node scripts/check-biome-changed.mjs gui
          node scripts/check-biome-changed.mjs webui

      - name: Check shared UI and virtual list
        run: |
          pnpm typecheck:ui
          pnpm typecheck:virtual-core
          pnpm test:virtual-core

  whitespace:
    name: Diff Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check committed diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          else
            git diff-tree --check --no-commit-id --root -r "${HEAD_SHA}"
          fi
