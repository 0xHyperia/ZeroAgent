      "glob": "patches/kbrain/**",
      "ownership": "adapted",
      "risk": "critical",
      "checks": [
        "精确依赖基准、补丁字节 SHA 和独立 checkout",
        "Native 目标/profile/凭据边界，Go 保持唯一执行器",
        "标准 SDK HTTP/SSE、初始化、401刷新及已知秘密反射",
        "stdio 阻塞写入、取消与各端进程树回收",
        "来源匹配的应用、平台与发布验收，通用缺陷上游替换后撤本地补丁"
      ]
    },
    {
      "glob": "crates/agent-gui/src/agent-ui-adapters/kbrainSkills.ts",
      "ownership": "adapted",
      "risk": "high",
      "checks": [
        "技能设置只携带调用方实际读取文档的版本，不借用最新 GET",
        "全局/工作区模式与独立 Go 协议兼容"
      ]
    },
    {
      "glob": "crates/agent-gui/src-tauri/src/services/configuration_coordinator.rs",
      "ownership": "zeroagent_owned",
      "risk": "critical",
      "checks": [
