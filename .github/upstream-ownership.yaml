        "客户端取消、profile 失效和工作副本脏信号隔离"
      ]
    },
    {
      "glob": "crates/agent-gui/src-tauri/src/services/backend_facade/**",
      "ownership": "zeroagent_owned",
      "risk": "critical",
      "checks": [
        "真实后端令牌不进入公开连接类型与 IPC",
        "profile 失效取消请求及空闲 SSE，退出回收监听",
        "私有 secrets 路由、编码别名与重定向拒绝",
        "大文件双向传输、分片反射清理及真实锁定后端验证"
      ]
    },
    {
      "glob": "crates/agent-gui/src-tauri/src/services/backend_facade.rs",
